name: may-be-gay

x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-runtime-environment: &runtime-environment
  SITE_DOMAIN: ${SITE_DOMAIN:-may-be.localhost}
  DATABASE_URL: ${DATABASE_URL:-postgres://may_be_app:local-only-app@db:5432/may_be_gay}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-only-auth-secret-change-before-any-real-use}
  MAIL_TRANSPORT: local
  MAIL_OUTBOX_DIR: /app/var/mail
  MEDIA_STORAGE: local
  MEDIA_LOCAL_ROOT: /app/var/media
  SERVICE_CLOSED_FILE: /app/var/service/SERVICE_CLOSED
  BACKUP_WORK_ROOT: /app/var/recovery
  NATIVE_PARSER_LOCK_FILE: /app/var/native/parser.lock
  OPERATIONS_LOG_ROOT: /app/var/logs
  OPERATIONS_DISK_PATH: /app/var/media
  MAIL_DAILY_QUOTA: "100"

# LOCAL DEVELOPMENT ONLY. This creates a private CA and uses deliberately public
# development passwords. Production requires separate secrets and DNS-01 TLS.
services:
  db:
    logging: *bounded-logs
    mem_limit: 768m
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_DB: may_be_gay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-bootstrap}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:-local-only-migrator}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-local-only-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
      - ./infra/postgres/bootstrap.sql:/opt/may-be-gay/bootstrap.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d may_be_gay"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [database]
    restart: unless-stopped

  migrate:
    logging: *bounded-logs
    build:
      context: .
      target: migrator
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://may_be_migrator:local-only-migrator@db:5432/may_be_gay}
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
    restart: "no"

  app:
    logging: *bounded-logs
    mem_limit: 768m
    cpus: 1.0
    build:
      context: .
      target: runner
    environment: *runtime-environment
    volumes:
      - media_data:/app/var/media
      - mail_outbox:/app/var/mail
      - service_state:/app/var/service:ro
      - native_lock:/app/var/native
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const h=require('node:http');const r=h.get({host:'127.0.0.1',port:3000,path:'/api/health',headers:{host:'app.'+process.env.SITE_DOMAIN}},s=>{s.resume();process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)});"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [web, database]
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment: *runtime-environment
    volumes:
      - media_data:/app/var/media
      - mail_outbox:/app/var/mail
      - service_state:/app/var/service:ro
      - operations_logs:/app/var/logs
      - recovery_work:/app/var/recovery
      - native_lock:/app/var/native
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, --conditions=react-server, --import, tsx, scripts/worker-health.ts]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 20s
    mem_limit: 1536m
    cpus: 1.0
    stop_grace_period: 30s
    logging: *bounded-logs
    networks: [web, database]
    restart: unless-stopped

  checks:
    build:
      context: .
      target: worker
    command: [node, --conditions=react-server, --import, tsx, scripts/check-operations.ts, --watch]
    environment: *runtime-environment
    volumes:
      - media_data:/app/var/media:ro
      - operations_logs:/app/var/logs
    depends_on:
      worker:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.25
    stop_grace_period: 40s
    logging: *bounded-logs
    networks: [web, database]
    restart: unless-stopped

  caddy:
    logging: *bounded-logs
    mem_limit: 128m
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-may-be.localhost}
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [web]
    restart: unless-stopped

networks:
  web:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  media_data:
  mail_outbox:
  service_state:
  operations_logs:
  recovery_work:
  native_lock:
